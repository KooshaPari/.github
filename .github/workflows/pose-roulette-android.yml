name: Pose Roulette Android cloud build
on:
  push:
    branches:
      - build/pose-roulette-mobile
    paths:
      - 'pose-roulette-build/android.part??'
      - '.github/workflows/pose-roulette-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct source
        run: |
          mkdir -p /tmp/pose-roulette
          cat pose-roulette-build/android.part?? | base64 --decode > /tmp/pose-roulette-android.zip
          unzip -q /tmp/pose-roulette-android.zip -d /tmp/pose-roulette
          test -f /tmp/pose-roulette/android/app/build.gradle.kts
      - name: Prepare Android SDK + Gradle
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        run: /tmp/gradle-9.4.1/bin/gradle -p /tmp/pose-roulette/android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pose-roulette-android
          path: |
            /tmp/pose-roulette/android/app/build/outputs/apk/debug/*.apk
            /tmp/pose-roulette/android/app/build/reports/**
          if-no-files-found: warn
